# GENERATED by scripts/gen-staging.py from render.yaml. Do not edit by hand.
# Staging Blueprint. Tracks branch: staging. Synthetic data only.
previews:
  generation: 'off'
envVarGroups:
- name: ari-stg-common
  envVars:
  - key: NODE_ENV
    value: production
  - key: LOG_FORMAT
    value: json
  - key: REGION_PIN
    value: frankfurt
  - key: DATA_CLASSIFICATION
    value: synthetic
  - key: SEED_SYNTHETIC
    value: 'true'
  - key: APP_ENV
    value: staging
- name: ari-stg-secrets-generated
  envVars:
  - key: SESSION_SECRET
    generateValue: true
  - key: AUDIT_HMAC_KEY
    generateValue: true
  - key: CSRF_SECRET
    generateValue: true
databases:
- name: ari-stg-db
  databaseName: ari_portal_stg
  user: app_migrator
  region: frankfurt
  plan: basic-1gb
  diskSizeGB: 5
  postgresMajorVersion: '16'
  ipAllowList: []
services:
- type: web
  name: ari-stg-public
  runtime: static
  region: frankfurt
  rootDir: .
  buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ari/public-site build
  staticPublishPath: apps/public-site/dist
  autoDeployTrigger: checksPass
  buildFilter:
    paths:
    - apps/public-site/**
    - packages/design-system/**
    - packages/i18n/**
    - pnpm-lock.yaml
    - render.yaml
    ignoredPaths:
    - '**/*.md'
  headers:
  - path: /*
    name: Strict-Transport-Security
    value: max-age=63072000; includeSubDomains
  - path: /*
    name: X-Content-Type-Options
    value: nosniff
  - path: /*
    name: Referrer-Policy
    value: strict-origin-when-cross-origin
  - path: /*
    name: X-Frame-Options
    value: DENY
  - path: /*
    name: Content-Security-Policy
    value: default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'
  routes:
  - type: rewrite
    source: /he/*
    destination: /he/index.html
  - type: rewrite
    source: /en/*
    destination: /en/index.html
  branch: staging
- type: web
  name: ari-stg-api
  runtime: node
  region: frankfurt
  plan: starter
  rootDir: .
  buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ari/api... build && pnpm --filter @ari/web build
  preDeployCommand: node db/migrate.mjs
  startCommand: node apps/api/dist/server.js
  healthCheckPath: /readyz
  maxShutdownDelaySeconds: 60
  autoDeployTrigger: checksPass
  numInstances: 1
  envVars:
  - fromGroup: ari-stg-common
  - fromGroup: ari-stg-secrets-generated
  - key: DATABASE_URL
    fromDatabase:
      name: ari-stg-db
      property: connectionString
  - key: WEB_DIST_DIR
