openapi: 3.1.0
info:
  title: ARI-PST Portal API
  version: 1.0.0-draft
  summary: Contract for the protected-area API (Phase 1 core resources).
  description: |
    Contract-first. This file is a fragment set for A3 resources. A1 merges it into packages/contracts.
    Rules:
    - Base path is /api/v1. Breaking change means a new major path (/api/v2).
    - JSON is camelCase. Dates are ISO 8601 UTC. Collection month is YYYY-MM.
    - Errors use RFC 9457 Problem Details with media type application/problem+json.
    - No patient identifiers in any request, response or error. Synthetic data only until GATE-PROD-DATA.
    - External roles never receive sample rows. They get aggregate resources only.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://portal.example.invalid/api/v1
    description: Placeholder. Real hosts set in infra.
tags:
  - name: auth
  - name: samples
  - name: search
  - name: requests
  - name: import
  - name: audit
  - name: admin
  - name: observability
  - name: public
  - name: center-ingestion
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      x-roles: public
      summary: Start a session with email and password. Returns the next step.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Credentials accepted. A second factor is required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401': { $ref: '#/components/responses/Problem401' }
        '429': { $ref: '#/components/responses/Problem429' }
  /auth/mfa/verify:
    post:
      tags: [auth]
      operationId: verifyMfa
      x-roles: public
      summary: Complete login with a TOTP code or a passkey assertion.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '200':
          description: Session created. Cookie is set (HttpOnly, Secure, SameSite=Strict).
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem401' }
        '429': { $ref: '#/components/responses/Problem429' }
  /auth/webauthn/options:
    post:
      tags: [auth]
      operationId: webauthnOptions
      x-roles: public
      summary: Get WebAuthn challenge options for a passkey login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken]
              properties:
                challengeToken: { type: string }
      responses:
        '200':
          description: Options object as defined by the WebAuthn standard.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Problem401' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      x-roles: [researcher_il, researcher_intl, center_clinician, national_coordinator, committee_member, system_admin]
      summary: End the current session.
      responses:
        '204': { description: Session ended. }
  /auth/session:
    get:
      tags: [auth]
      operationId: getAuthSession
      x-roles: [researcher_il, researcher_intl, center_clinician, national_coordinator, committee_member, system_admin]
      summary: Read the current session, role set and active center (alias of GET /session).
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem401' }

  /samples:
    get:
      tags: [samples]
      operationId: listSamples
      x-roles: [center_clinician, national_coordinator]
      summary: List sample rows. Roles center_clinician (own center only) and national_coordinator.
      description: External roles get 403. Use /search/aggregate instead.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: centerId
          in: query
          schema: { $ref: '#/components/schemas/CenterId' }
        - name: diagnosisCode
          in: query
          schema: { type: string }
        - name: sampleType
          in: query
          schema: { $ref: '#/components/schemas/SampleType' }
        - name: availability
          in: query
          schema: { $ref: '#/components/schemas/Availability' }
        - name: staleness
          in: query
          schema: { type: string, enum: [fresh, due_soon, stale] }
      responses:
        '200':
          description: A page of samples.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SamplePage' }
        '403': { $ref: '#/components/responses/Problem403' }
    post:
      tags: [samples]
      operationId: createSample
      x-roles: [national_coordinator]
      summary: Create one sample record (minimal entry screen). national_coordinator only.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SampleCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sample' }
        '403': { $ref: '#/components/responses/Problem403' }
        '422': { $ref: '#/components/responses/Problem422' }
  /samples/{sampleId}:
    parameters:
      - $ref: '#/components/parameters/SampleIdPath'
    get:
      tags: [samples]
      operationId: getSample
      x-roles: [center_clinician, national_coordinator]
      summary: Read one sample. Clinician only for own center.
      responses:
        '200':
          description: The sample.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sample' }
        '404': { $ref: '#/components/responses/Problem404' }
    patch:
      tags: [samples]
      operationId: updateSample
      x-roles: [national_coordinator]
      summary: Update fields of a sample. national_coordinator only. Sets updatedAt.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: ETag from the last read. Prevents lost updates.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/SampleUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sample' }
        '412': { $ref: '#/components/responses/Problem412' }
        '422': { $ref: '#/components/responses/Problem422' }
  /samples/{sampleId}/verify:
    post:
      tags: [samples]
      operationId: verifySample
      x-roles: [center_clinician, national_coordinator]
      summary: Confirm the record is still correct. Sets lastVerifiedAt to now.
      parameters:
        - $ref: '#/components/parameters/SampleIdPath'
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sample' }
  /samples/{sampleId}/retire:
    post:
      tags: [samples]
      operationId: retireSample
      x-roles: [national_coordinator]
      summary: Soft delete. The record leaves search at once. Purge follows the retention policy.
      parameters:
        - $ref: '#/components/parameters/SampleIdPath'
      responses:
        '204': { description: Retired. }

  /search/aggregate:
    post:
      tags: [search]
      operationId: searchAggregate
      x-roles: [researcher_il, researcher_intl, center_clinician, national_coordinator, committee_member]
      summary: Count samples that match filters. k-anonymous. All roles except anonymous.
      description: |
        Returns a count or a suppressed marker. Never returns rows or ids.
        If the filtered set is smaller than k, the result is suppressed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200':
          description: Aggregate result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregateResult' }
        '429': { $ref: '#/components/responses/Problem429' }
  /search/facets:
    post:
      tags: [search]
      operationId: searchFacets
      x-roles: [researcher_il, researcher_intl, center_clinician, national_coordinator, committee_member]
      summary: Facet counts for the current filters. k-anonymous.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FacetRequest' }
      responses:
        '200':
          description: Facet buckets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacetResult' }
        '429': { $ref: '#/components/responses/Problem429' }
  /search/suggest:
    get:
      tags: [search]
      operationId: suggestTerms
      x-roles: [researcher_il, researcher_intl, center_clinician, national_coordinator, committee_member]
      summary: Smart search. Map free text (he or en) to diagnosis terms.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Ranked diagnosis suggestions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DiagnosisSuggestion' }
  /diagnoses:
    get:
      tags: [search]
      operationId: listDiagnoses
      x-roles: public
      summary: Diagnosis vocabulary tree with labels in he and en.
      security:
        - sessionCookie: []
        - {}
      responses:
        '200':
          description: Vocabulary.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DiagnosisTerm' }

  /requests:
    get:
      tags: [requests]
      operationId: listRequests
      x-roles: [researcher_il, center_clinician, national_coordinator, committee_member]
      summary: List requests. Applicant sees own. Coordinator and committee see all they may see.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RequestStatus' }
      responses:
        '200':
          description: A page of requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestPage' }
    post:
      tags: [requests]
      operationId: createRequest
      x-roles: [researcher_il]
      summary: Create a draft request. researcher_il only.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestCreate' }
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }
  /requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/RequestIdPath'
    get:
      tags: [requests]
      operationId: getRequest
      x-roles: [researcher_il, center_clinician, national_coordinator, committee_member]
      summary: Read one request with items and visible steps.
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '404': { $ref: '#/components/responses/Problem404' }
    patch:
      tags: [requests]
      operationId: updateRequestDraft
      x-roles: [researcher_il]
      summary: Edit a draft request.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/RequestCreate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '409': { $ref: '#/components/responses/Problem409' }
  /requests/{requestId}/items:
    post:
      tags: [requests]
      operationId: addRequestItem
      x-roles: [researcher_il]
      summary: Add a cart item. It holds search criteria, not sample ids.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestItemCreate' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestItem' }
        '422': { $ref: '#/components/responses/Problem422' }
  /requests/{requestId}/items/{itemId}:
    delete:
      tags: [requests]
      operationId: removeRequestItem
      x-roles: [researcher_il]
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed. }
  /requests/{requestId}/submit:
    post:
      tags: [requests]
      operationId: submitRequest
      x-roles: [researcher_il]
      summary: Submit a draft. All form fields must be set.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '422': { $ref: '#/components/responses/Problem422' }
  /requests/{requestId}/steps:
    get:
      tags: [requests]
      operationId: listRequestSteps
      x-roles: [researcher_il, center_clinician, national_coordinator, committee_member]
      summary: Steps and public notes. Applicant sees public fields only.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: Steps in order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RequestStep' }
  /requests/{requestId}/steps/{stepKey}:
    patch:
      tags: [requests]
      operationId: updateRequestStep
      x-roles: [national_coordinator, center_clinician]
      summary: Change a step status or add a note. national_coordinator only.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
        - name: stepKey
          in: path
          required: true
          schema: { $ref: '#/components/schemas/StepKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestStepUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestStep' }
        '409': { $ref: '#/components/responses/Problem409' }
  /requests/{requestId}/resolved-samples:
    put:
      tags: [requests]
      operationId: resolveRequestSamples
      x-roles: [national_coordinator]
      summary: Coordinator links an item to concrete sample ids. Never shown to the applicant.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, sampleIds]
              properties:
                itemId: { type: string }
                sampleIds:
                  type: array
                  items: { $ref: '#/components/schemas/SampleId' }
      responses:
        '204': { description: Linked. }
    get:
      tags: [requests]
      operationId: listResolvedSamples
      x-roles: [national_coordinator, center_clinician]
      summary: Sample links of a request. Coordinator sees all; a center clinician sees only the links of the own center (row-level security).
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: Links (coded sample ids only).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ResolvedSample' }
        '404': { $ref: '#/components/responses/Problem404' }
  /requests/{requestId}/agreements:
    get:
      tags: [requests]
      operationId: listRequestAgreements
      x-roles: [national_coordinator, committee_member, center_clinician]
      summary: MTA/DTA records per center (status, reference, signed month). A center clinician sees only the own center.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: Agreements.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RequestAgreement' }
        '404': { $ref: '#/components/responses/Problem404' }
  /requests/{requestId}/votes:
    put:
      tags: [requests]
      operationId: castVote
      x-roles: [committee_member]
      summary: Committee member casts or changes own vote until a decision exists.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vote]
              properties:
                vote: { type: string, enum: [approve, reject, abstain] }
                comment: { type: string, maxLength: 1000 }
                rationaleCode: { type: string, pattern: '^[a-z_]{1,40}$', description: Required by the database for a reject vote. }
      responses:
        '200':
          description: Vote stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vote' }
        '409': { $ref: '#/components/responses/Problem409' }
  /requests/{requestId}/decisions:
    get:
      tags: [requests]
      operationId: listDecisions
      x-roles: [researcher_il, national_coordinator, committee_member]
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: Decisions. Rationale is visible to committee and coordinator only.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Decision' }
    post:
      tags: [requests]
      operationId: recordDecision
      x-roles: [committee_member]
      summary: Record the committee decision. Needs N approving votes (configuration).
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [approved, rejected, needs_info] }
                rationale: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Decision recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '409': { $ref: '#/components/responses/Problem409' }

  /import-jobs:
    get:
      tags: [import]
      operationId: listImportJobs
      x-roles: [national_coordinator]
      summary: List import jobs. national_coordinator only.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of jobs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJobPage' }
    post:
      tags: [import]
      operationId: createImportJob
      x-roles: [national_coordinator]
      summary: Upload a CSV or XLSX file. Always starts as a dry run.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentEncoding: base64
                  description: CSV (UTF-8) or XLSX. Max 10 MB. Max 20000 rows.
                centerId: { $ref: '#/components/schemas/CenterId' }
      responses:
        '202':
          description: Accepted. Validation runs in the background.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '413': { $ref: '#/components/responses/Problem413' }
        '422': { $ref: '#/components/responses/Problem422' }
  /import-jobs/{jobId}:
    get:
      tags: [import]
      operationId: getImportJob
      x-roles: [national_coordinator]
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        '200':
          description: Job with counters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
  /import-jobs/{jobId}/rows:
    get:
      tags: [import]
      operationId: listImportRows
      x-roles: [national_coordinator]
      summary: Row results. Row number, field names, rule codes. No cell values.
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: outcome
          in: query
          schema: { type: string, enum: [accepted, warning, rejected] }
      responses:
        '200':
          description: A page of row results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportRowPage' }
  /import-jobs/{jobId}/report:
    get:
      tags: [import]
      operationId: downloadImportReport
      x-roles: [national_coordinator]
      summary: Rejection report as CSV. Audited as a download.
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        '200':
          description: CSV report.
          content:
            text/csv:
              schema: { type: string }
  /import-jobs/{jobId}/result-map:
    get:
      tags: [import]
      operationId: downloadImportResultMap
      x-roles: [national_coordinator]
      summary: CSV of rowNo and sampleCode for created rows. Kept 30 days. Audited as a download.
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        '200':
          description: CSV with columns row_no and sample_code.
          content:
            text/csv:
              schema: { type: string }
  /import-jobs/{jobId}/commit:
    post:
      tags: [import]
      operationId: commitImportJob
      x-roles: [national_coordinator]
      summary: Commit a validated dry run. Creates a child job in mode commit.
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileSha256]
              properties:
                fileSha256: { type: string, pattern: '^[0-9a-f]{64}$', description: Must match the validated file. }
                acceptWarnings: { type: boolean, default: false }
      responses:
        '202':
          description: Commit started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '409': { $ref: '#/components/responses/Problem409' }
  /import-templates/{format}:
    get:
      tags: [import]
      operationId: downloadImportTemplate
      x-roles: [national_coordinator]
      summary: Empty template with header row and a data dictionary sheet.
      parameters:
        - name: format
          in: path
          required: true
          schema: { type: string, enum: [csv, xlsx] }
      responses:
        '200':
          description: Template file.
          content:
            text/csv: { schema: { type: string } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, contentEncoding: base64 }

  /audit-events:
    get:
      tags: [audit]
      operationId: queryAuditEvents
      x-roles: [system_admin, national_coordinator, committee_member]
      summary: Query the audit log. system_admin only. Querying is itself audited.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: actorUserId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string, pattern: '^[a-z_]+\.[a-z_]+$' } }
        - { name: objectType, in: query, schema: { type: string } }
        - { name: objectId, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [success, denied, error] } }
      responses:
        '200':
          description: A page of events, newest first.
