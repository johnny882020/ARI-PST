      operationId: recoverMfa
      x-roles: public
      summary: Complete login with a single-use recovery code.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryLoginRequest' } } } }
      responses:
        '200': { description: Session created., content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Problem401' }
        '429': { $ref: '#/components/responses/Problem429' }
  /auth/methods:
    get:
      tags: [auth]
      operationId: listAuthMethods
      x-roles: [researcher_il, researcher_intl, center_clinician, national_coordinator, committee_member, system_admin]
      summary: Own enrolled second factors (no secrets).
      responses:
        '200': { description: Methods., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AuthMethod' } } } } } } }
        '401': { $ref: '#/components/responses/Problem401' }
  /request-cart:
    get:
      tags: [requests]
      operationId: getRequestCart
      x-roles: [researcher_il]
      summary: The applicant's cart (items of the open draft request). Counts are k-safe buckets.
      responses:
        '200': { description: Cart., content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '403': { $ref: '#/components/responses/Problem403' }
  /request-cart/items:
    post:
      tags: [requests]
      operationId: addCartItem
      x-roles: [researcher_il]
      summary: Add a search (criteria, optional free text) to the cart.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CartItemCreate' } } } }
      responses:
        '201': { description: Cart., content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '429': { $ref: '#/components/responses/Problem429' }
  /request-cart/items/{itemId}:
    delete:
      tags: [requests]
      operationId: removeCartItem
      x-roles: [researcher_il]
      summary: Remove an item from the cart.
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cart., content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '404': { $ref: '#/components/responses/Problem404' }
  /request-cart/start:
    post:
      tags: [requests]
      operationId: startRequestFromCart
      x-roles: [researcher_il]
      summary: Turn the cart into the draft request to fill in and submit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Draft request., content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
  /requests/{requestId}/precheck:
    post:
      tags: [requests]
      operationId: precheckRequest
      x-roles: [national_coordinator]
      summary: Coordinator pre-check outcome. forward = checklist passed, send to committee.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PrecheckDecision' } } } }
      responses:
        '200': { description: Request., content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
  /requests/{requestId}/respond:
    post:
      tags: [requests]
      operationId: respondToInfoRequest
      x-roles: [researcher_il]
      summary: Applicant answers a request for information. The request returns to pre-check. The text is checked for identifiers and is not stored.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [message], properties: { message: { type: string, minLength: 1, maxLength: 2000 } } } } } }
      responses:
        '200': { description: Request., content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
  /requests/{requestId}/vote-tally:
    get:
      tags: [requests]
      operationId: getVoteTally
      x-roles: [committee_member, national_coordinator]
      summary: Vote counts and own vote for the committee panel.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200': { description: Tally., content: { application/json: { schema: { $ref: '#/components/schemas/VoteTally' } } } }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
  /registrations:
    get:
      tags: [admin]
      operationId: listPendingRegistrations
      x-roles: [national_coordinator]
      summary: Researcher registrations. national_coordinator.
      responses:
        '200': { description: Registrations., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Registration' } } } } } } }
        '403': { $ref: '#/components/responses/Problem403' }
  /registrations/{id}/decision:
    post:
      tags: [admin]
      operationId: decideRegistration
      x-roles: [national_coordinator]
      summary: Approve or reject a registration. Approval grants researcher_il or researcher_intl. Needs step-up.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OutcomeDecision' } } } }
      responses:
        '200': { description: Registration., content: { application/json: { schema: { $ref: '#/components/schemas/Registration' } } } }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
  /k-policies:
    get:
      tags: [admin]
      operationId: listKPolicies
      x-roles: [system_admin, committee_member, national_coordinator]
      summary: k policies with any pending change. Staff roles with a need to know.
      responses:
        '200': { description: Policies., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/KPolicy' } } } } } } }
        '403': { $ref: '#/components/responses/Problem403' }
  /k-policies/{id}/changes:
    post:
      tags: [admin]
      operationId: proposeKPolicyChange
      x-roles: [system_admin]
      summary: Propose a higher k (5 or more). Another person must approve. Needs step-up.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z_]{2,32}$' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KPolicyChange' } } } }
      responses:
        '202': { description: Pending., content: { application/json: { schema: { $ref: '#/components/schemas/KPolicy' } } } }
        '403': { $ref: '#/components/responses/Problem403' }
        '422': { $ref: '#/components/responses/Problem422' }
  /k-policy-changes/{id}/approve:
    post:
      tags: [admin]
      operationId: approveKPolicyChange
      x-roles: [committee_member]
      summary: Approve a pending k change. The database requires a different person with the approver role. Needs step-up.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Policy., content: { application/json: { schema: { $ref: '#/components/schemas/KPolicy' } } } }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
  /role-grant-requests:
    get:
      tags: [admin]
      operationId: listRoleGrantRequests
      x-roles: [system_admin, committee_member, national_coordinator]
      summary: Pending and decided privileged role grants.
      responses:
        '200': { description: Requests., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/RoleGrantRequest' } } } } } } }
        '403': { $ref: '#/components/responses/Problem403' }
    post:
      tags: [admin]
      operationId: createRoleGrantRequest
      x-roles: [system_admin]
      summary: Request a privileged role for a user. A second person approves. Needs step-up.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleGrantRequestCreate' } } } }
      responses:
        '202': { description: Pending., content: { application/json: { schema: { $ref: '#/components/schemas/RoleGrantRequest' } } } }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
  /role-grant-requests/{id}/decision:
    post:
      tags: [admin]
      operationId: decideRoleGrantRequest
      x-roles: [system_admin, committee_member, national_coordinator]
      summary: Approve or reject. The approver must differ from the requester and hold the role the database demands. Needs step-up.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OutcomeDecision' } } } }
      responses:
        '200': { description: Decided., content: { application/json: { schema: { $ref: '#/components/schemas/RoleGrantRequest' } } } }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sid
      description: Server-side session cookie (HttpOnly, Secure, SameSite=Strict). Unsafe methods also need the X-CSRF-Token header equal to the __Host-csrf cookie.
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from nextCursor.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Required on POST that creates requests or imports. 8 to 128 chars. Same key and same body returns the first result.
      schema: { type: string, minLength: 8, maxLength: 128 }
    SampleIdPath:
      name: sampleId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SampleId' }
    RequestIdPath:
      name: requestId
      in: path
      required: true
      schema: { type: string, pattern: '^req_[0-9A-HJKMNP-TV-Z]{26}$' }
    JobIdPath:
      name: jobId
      in: path
      required: true
      schema: { type: string, pattern: '^imp_[0-9A-HJKMNP-TV-Z]{26}$' }
  responses:
    Problem401: { description: Not authenticated., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Problem403: { description: Role not allowed., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Problem404: { description: Not found or not visible to this role., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Problem409: { description: Conflict with current state., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Problem412: { description: ETag mismatch., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Problem413: { description: File too large., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Problem422: { description: Validation failed., content: { application/problem+json: { schema: { $ref: '#/components/schemas/ValidationProblem' } } } }
    Problem429: { description: Rate limit., headers: { Retry-After: { schema: { type: integer } } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details. No identifiers and no user text in any member.
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, format: uri-reference, examples: ['/problems/validation-failed'] }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: 'Stable machine code, e.g. VALIDATION_FAILED, KANON_SUPPRESSED, SOD_VIOLATION.' }
        traceId: { type: string }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, rule]
                properties:
                  field: { type: string }
                  rule: { type: string, examples: [VOCAB, REQUIRED, FORMAT, IDENTIFIER_SUSPECTED] }
    SampleId: { type: string, pattern: '^smp_[0-9A-HJKMNP-TV-Z]{26}$' }
    CenterId: { type: string, pattern: '^ctr_[0-9A-HJKMNP-TV-Z]{26}$' }
    Role:
      type: string
      enum: [researcher_il, researcher_intl, center_clinician, national_coordinator, committee_member, system_admin]
    SampleType: { type: string, enum: [ffpe, frozen, csf, plasma_or_liquid_biopsy, isolated_dna_rna] }
    Availability: { type: string, enum: [available, limited, depleted] }
    AgeBand: { type: string, enum: ['0_lt1', '1_lt3', '3_lt6', '6_lt10', '10_lt15', '15_lt18'] }
    Sex: { type: string, enum: [female, male, other_or_unknown] }
    Timepoint: { type: string, enum: [diagnosis, during_treatment, relapse] }
    AttachedData: { type: string, enum: [wes, wgs, rna_seq, mri, digital_pathology, redcap_clinical] }
    ConsentStatus: { type: string, enum: [consent_obtained, broad_consent, waiver_by_committee, restricted, unknown] }
    QuantityClass: { type: string, enum: [small, medium, large] }
    Sample:
      type: object
      required: [sampleCode, sourceCenterId, diagnosisCode, ageBandAtDiagnosis, sex, sampleType, availability, clinicalTimepoint, collectionMonth, attachedData, consentStatus, contactRef, createdAt, updatedAt, lastVerifiedAt]
      properties:
        sampleCode: { $ref: '#/components/schemas/SampleId' }
        sourceCenterId: { $ref: '#/components/schemas/CenterId' }
        diagnosisCode: { type: string }
        ageBandAtDiagnosis: { $ref: '#/components/schemas/AgeBand' }
        sex: { $ref: '#/components/schemas/Sex' }
        sampleType: { $ref: '#/components/schemas/SampleType' }
        availability: { $ref: '#/components/schemas/Availability' }
        quantityClass: { oneOf: [{ $ref: '#/components/schemas/QuantityClass' }, { type: 'null' }] }
        clinicalTimepoint: { $ref: '#/components/schemas/Timepoint' }
        collectionMonth: { type: string, pattern: '^(19[89][0-9]|20[0-9]{2})-(0[1-9]|1[0-2])$' }
        attachedData:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/AttachedData' }
        consentStatus: { $ref: '#/components/schemas/ConsentStatus' }
        ethicsApprovalRef: { type: [string, 'null'], description: Opaque approval ID. }
        contactRef: { type: string, description: Center contact role label. }
        staleness: { type: string, enum: [fresh, due_soon, stale] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastVerifiedAt: { type: string, format: date-time }
    SampleCreate:
      type: object
      additionalProperties: false
      required: [sourceCenterId, diagnosisCode, ageBandAtDiagnosis, sex, sampleType, availability, clinicalTimepoint, collectionMonth]
      properties:
        sourceCenterId: { $ref: '#/components/schemas/CenterId' }
        diagnosisCode: { type: string }
        ageBandAtDiagnosis: { $ref: '#/components/schemas/AgeBand' }
        sex: { $ref: '#/components/schemas/Sex' }
        sampleType: { $ref: '#/components/schemas/SampleType' }
        availability: { $ref: '#/components/schemas/Availability' }
        quantityClass: { $ref: '#/components/schemas/QuantityClass' }
        clinicalTimepoint: { $ref: '#/components/schemas/Timepoint' }
        collectionMonth: { type: string, pattern: '^(19[89][0-9]|20[0-9]{2})-(0[1-9]|1[0-2])$' }
        attachedData:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/AttachedData' }
        consentStatus: { $ref: '#/components/schemas/ConsentStatus' }
        ethicsApprovalId: { type: string, description: Id of an ethics approval of the same center. }
    SampleUpdate:
      type: object
      additionalProperties: false
      description: Same fields as SampleCreate except sourceCenterId, all optional.
      properties:
        diagnosisCode: { type: string }
        ageBandAtDiagnosis: { $ref: '#/components/schemas/AgeBand' }
        sex: { $ref: '#/components/schemas/Sex' }
        sampleType: { $ref: '#/components/schemas/SampleType' }
        availability: { $ref: '#/components/schemas/Availability' }
        quantityClass: { $ref: '#/components/schemas/QuantityClass' }
        clinicalTimepoint: { $ref: '#/components/schemas/Timepoint' }
        collectionMonth: { type: string, pattern: '^(19[89][0-9]|20[0-9]{2})-(0[1-9]|1[0-2])$' }
        attachedData:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/AttachedData' }
        consentStatus: { $ref: '#/components/schemas/ConsentStatus' }
        ethicsApprovalId: { type: [string, 'null'] }
    SamplePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Sample' }
        nextCursor: { type: [string, 'null'] }
    SearchFilters:
      type: object
      additionalProperties: false
      description: Each key is optional. Values inside one key are OR. Keys are AND. attachedData is all-of.
      properties:
        diagnosis: { type: array, maxItems: 50, items: { type: string } }
        sampleType: { type: array, items: { $ref: '#/components/schemas/SampleType' } }
        ageBand: { type: array, items: { $ref: '#/components/schemas/AgeBand' } }
        sex: { type: array, items: { $ref: '#/components/schemas/Sex' } }
        centerId: { type: array, items: { $ref: '#/components/schemas/CenterId' } }
        timepoint: { type: array, items: { $ref: '#/components/schemas/Timepoint' } }
        availability: { type: array, items: { $ref: '#/components/schemas/Availability' } }
        attachedData: { type: array, items: { $ref: '#/components/schemas/AttachedData' } }
    SearchRequest:
      type: object
      additionalProperties: false
      properties:
        q: { type: string, maxLength: 200, description: Free text. Expanded to diagnosis terms before counting. }
        lang: { type: string, enum: [he, en] }
        filters: { $ref: '#/components/schemas/SearchFilters' }
    AggregateResult:
      type: object
      required: [suppressed, label]
      properties:
        count: { type: [integer, 'null'], description: Null when suppressed. }
        suppressed: { type: boolean }
        label: { type: string, description: 'Display text: the count as text, or too_few when suppressed. The threshold is never shown to external roles.' }
        k: { type: integer, minimum: 2, description: 'Only returned to national_coordinator.' }
        resolvedFilters: { $ref: '#/components/schemas/SearchFilters' }
    FacetRequest:
      type: object
      additionalProperties: false
      required: [facets]
      properties:
        q: { type: string, maxLength: 200 }
        lang: { type: string, enum: [he, en] }
        filters: { $ref: '#/components/schemas/SearchFilters' }
        facets:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { type: string, enum: [diagnosis, sampleType, ageBand, sex, center, timepoint, availability, attachedData] }
    FacetBucket:
      type: object
      required: [bucket, level, suppressed]
      properties:
        bucket: { type: string, description: Value code or 'other'. }
        level: { type: string, enum: [value, type, family_other, group_other, other] }
        count: { type: [integer, 'null'] }
        suppressed: { type: boolean }
    FacetResult:
      type: object
      required: [facets]
      properties:
        k: { type: integer }
        facets:
          type: object
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/FacetBucket' }
    DiagnosisSuggestion:
      type: object
      required: [diagnosisCode, score, matchedVia, labelHe, labelEn]
      properties:
        diagnosisCode: { type: string }
        score: { type: number }
        matchedVia: { type: string, enum: [exact, fts, trgm] }
        labelHe: { type: string }
        labelEn: { type: string }
    DiagnosisTerm:
      type: object
      required: [diagnosisCode, level, labelHe, labelEn]
      properties:
        diagnosisCode: { type: string }
        parentCode: { type: [string, 'null'] }
        level: { type: string, enum: [group, family, type] }
        icdo3Morph: { type: [string, 'null'], pattern: '^[0-9]{4}/[0-9]$', description: Reference only. Not unique. }
        labelHe: { type: string }
        labelEn: { type: string }
    RequestStatus:
      type: string
      enum: [draft, submitted, precheck, needs_info, committee_review, appeal_review, approved, rejected, center_coordination, agreements, delivery, closed]
    StepKey:
      type: string
      enum: [submitted, precheck, committee_review, decision, center_coordination, mta_dta, delivery, closed]
    RequestCreate:
      type: object
      properties:
        researchQuestion: { type: string, maxLength: 4000 }
        applicantEthicsRef: { type: string, maxLength: 64, description: Applicant IRB or Helsinki approval ID. }
        plannedUse: { type: string, maxLength: 4000 }
        fundingSources: { type: string, maxLength: 1000 }
    RequestItemCreate:
      type: object
      required: [criteria]
      properties:
        criteria: { $ref: '#/components/schemas/SearchFilters' }
        requestedCount: { type: integer, minimum: 1 }
    RequestItem:
      type: object
      required: [id, criteria]
      properties:
        id: { type: string }
        criteria: { $ref: '#/components/schemas/SearchFilters' }
        requestedCount: { type: [integer, 'null'] }
        shownCountBucket: { type: [string, 'null'], enum: [lt10, 10_plus, null], description: 'K-safe bucket shown when the item was added. The exact count is never stored.' }
    Request:
      type: object
      required: [id, status, createdAt, items]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/RequestStatus' }
        closeReason: { type: [string, 'null'], enum: [delivered, withdrawn, expired, rejected, policy_cancelled, null] }
        applicantUserId: { type: string }
        researchQuestion: { type: [string, 'null'] }
        applicantEthicsRef: { type: [string, 'null'] }
        plannedUse: { type: [string, 'null'] }
        fundingSources: { type: [string, 'null'] }
        items:
          type: array
          items: { $ref: '#/components/schemas/RequestItem' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/RequestStep' }
        submittedAt: { type: [string, 'null'], format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        deliveredAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    RequestPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Request' }
        nextCursor: { type: [string, 'null'] }
    RequestStep:
      type: object
      required: [stepKey, status]
      properties:
        stepKey: { $ref: '#/components/schemas/StepKey' }
        centerId: { type: [string, 'null'] }
        status: { type: string, enum: [pending, in_progress, done, skipped, blocked] }
        publicNote: { type: [string, 'null'], maxLength: 1000 }
        internalNote: { type: [string, 'null'], maxLength: 2000, description: Coordinator and committee only. Omitted for applicants. }
        accepted: { type: [boolean, 'null'], description: 'center_coordination step: the center accepted (true) or declined (false). Omitted for applicants.' }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    RequestStepUpdate:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [pending, in_progress, done, skipped, blocked] }
