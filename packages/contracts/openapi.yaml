            kind: { type: string, enum: [mta, dta] }
            docRef: { type: string, pattern: '^[A-Za-z0-9._/-]{3,64}$' }
            status: { $ref: '#/components/schemas/AgreementStatus' }
            signedMonth: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
