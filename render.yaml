# ARI-PST Portal - production Blueprint. Tracks branch: main. Lives at the repo root so Render finds it.
# Staging: infra/render.staging.yaml (generated by scripts/gen-staging.py, tracks branch: staging).
# Validate: python3 scripts/verify-render-yaml.py   and   render blueprints validate render.yaml (CLI 2.7.0+)
#
# Topology (canonical decision C-04, C-03 same origin):
#   ari-public  static site, Astro, he/en, auto-deploys after CI passes.
#   ari-api     ONE web service. Serves /api/v1 AND the protected SPA (apps/web/dist) on the same host,
#               so the __Host-sid cookie works and no CORS is needed. (The separate static site "ari-app"
#               from the plan is NOT created: a static site on another host would break same-origin.)
#   ari-db      managed Postgres, Frankfurt, private network only.
#   crons       snapshot + audit-verify (hourly), staleness (daily), purge (nightly), export.
#
# REGION: Blueprints have no variables. Region is written once per resource as "frankfurt" (GATE-REGION).
# scripts/verify-render-yaml.py and infra/policy/render.rego fail if any region differs. Changing region
# needs an ADR and a data migration plan. Postgres region is immutable after creation.
#
# DATABASE LOGINS (C-06). Render creates ONE database user (ari_owner, owns the database, not a superuser).
#   It is used ONLY by the pre-deploy step (scripts/render-predeploy.mjs), which creates the app roles with the
#   generated passwords below, runs db/bootstrap.sql and then db/migrate.mjs as app_migrator.
#   The API logs in as app_runtime, crons as app_readonly_bg. They build their URL from DB_HOST/DB_PORT/DB_NAME
#   plus their own password (apps/api/src/lib/db-url.ts). ASSUMPTION (UNVERIFIED): the Render user has CREATEROLE.
# ENV NAMES: apps/api/src/config.ts is the single source. scripts/verify-render-yaml.py checks this file against it.
# SECRETS: none in Git. Generated by Render (generateValue) or entered once in the Dashboard (sync: false).
# PLAN SLUGS: marked UNVERIFIED where not in the local Render skill docs. Check them in the Dashboard.
# DATA: synthetic only until GATE-PROD-DATA closes (DATA_CLASSIFICATION=synthetic).

previews:
  generation: automatic          # every PR gets a preview with its own empty database. Seeded with synthetic data (IS_PULL_REQUEST).
  expireAfterDays: 3

envVarGroups:
  - name: ari-common
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.21.1             # >= 22.18 needed (db/ scripts import TypeScript sources directly)
      - key: LOG_FORMAT
        value: json
      - key: DATA_CLASSIFICATION
        value: synthetic           # flips to "index" only by ADR after GATE-PROD-DATA. The API refuses to start otherwise.
      - key: REGION_PIN
        value: frankfurt
  - name: ari-secrets-generated    # API only
    envVars:
      - key: IP_HASH_SALT
        generateValue: true
      - key: SECRETS_KEY           # encrypts TOTP secrets at rest. Losing it locks every TOTP user out. No rotation tool yet.
        generateValue: true
  - name: ari-db-runtime           # API only: password of the app_runtime login
    envVars:
      - key: DB_PASSWORD_RUNTIME
        generateValue: true
  - name: ari-db-bg                # API pre-deploy (sets it) and crons (use it): password of app_readonly_bg
    envVars:
      - key: DB_PASSWORD_BG
        generateValue: true

databases:
  - name: ari-db
    databaseName: ari_portal
    user: ari_owner                # bootstrap only. NOT an app role. After the first deploy the database is owned by app_migrator.
    region: frankfurt              # immutable
    plan: pro-4gb                  # UNVERIFIED slug. Chosen for PITR (RT-14). Basic plans have a shorter window.
    previewPlan: basic-256mb
    diskSizeGB: 20                 # UNVERIFIED valid sizes per plan
    previewDiskSizeGB: 1
    postgresMajorVersion: "16"     # immutable
    ipAllowList: []                # private network only. No public access.

services:
  # 1. Public site (static). Auto-deploys when GitHub checks pass on main.
  - type: web
    name: ari-public
    runtime: static
    region: frankfurt
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ari/public-site build
    staticPublishPath: apps/public-site/dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/public-site/**
        - packages/design-system/**
        - packages/i18n/**
        - pnpm-lock.yaml
        - render.yaml
      ignoredPaths:
        - "**/*.md"
    envVars:
      - key: NODE_VERSION
        value: 22.21.1
      # Build-time, public values. The site is a separate origin from the portal (QA-010).
      # CHANGE BOTH if Render gives ari-api another host name (name taken) or when a custom domain is set,
      # and change the same host in the Content-Security-Policy header below.
      - key: PUBLIC_PORTAL_URL
        value: https://ari-api.onrender.com/
      - key: PUBLIC_API_BASE
        value: https://ari-api.onrender.com
    # Mirrors apps/public-site/public/_headers (Render ignores that file). scripts/verify-render-yaml.py compares them.
    # Only difference: connect-src and form-action also allow the API origin, for the join/contact forms.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://ari-api.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self' https://ari-api.onrender.com; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /uploads/*
        name: Cache-Control
        value: public, max-age=86400
      # Decap CMS admin needs inline styles and the GitHub API. Never indexed.
      - path: /admin/*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com https://*.githubusercontent.com; font-src 'self' data:; connect-src 'self' https://api.github.com https://cms-auth.ari-pst.example; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
      - path: /admin/*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /admin/*
        name: Cache-Control
        value: no-store
    routes:
      - type: redirect               # old default portal link (QA-010). The SPA lives at / on the API host.
        source: /app/*
        destination: https://ari-api.onrender.com/
      - type: rewrite
        source: /he/*
        destination: /he/index.html
      - type: rewrite
        source: /en/*
        destination: /en/index.html

  # 2. API + protected SPA on one host. Production auto-deploy is OFF: deploy only from the
  #    GitHub workflow deploy-protected.yml after the "production-protected" environment is approved.
  - type: web
    name: ari-api
    runtime: node
    region: frankfurt
    plan: starter                  # UNVERIFIED sizing. Two instances for HA (C-04).
    previewPlan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ari/api... build && pnpm --filter @ari/web build
    preDeployCommand: node scripts/render-predeploy.mjs   # roles (idempotent) + forward-only migrations as app_migrator + synthetic seed. Failure aborts the deploy.
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /readyz                          # DB reachable + migrations at the level this build expects (C-05)
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: "off"
    numInstances: 2
    envVars:
      - fromGroup: ari-common
      - fromGroup: ari-secrets-generated
      - fromGroup: ari-db-runtime
      - fromGroup: ari-db-bg
      # --- database. The owner string and the migrator password are used by the pre-deploy step only;
      #     the API process removes them from its environment at start (apps/api/src/server.ts).
      - key: DATABASE_URL_OWNER
        fromDatabase:
          name: ari-db
          property: connectionString
      - key: DB_PASSWORD_MIGRATOR
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: ari-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ari-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ari-db
          property: database
      # --- synthetic data (the only data allowed until GATE-PROD-DATA). Remove SEED_SYNTHETIC by ADR when the gate closes.
      - key: SEED_SYNTHETIC
        value: "true"
      - key: SEED_PROFILE
        value: preview                                # 600 synthetic samples, 3 centers, 14 users, 9 requests
      - key: SEED_USER_PASSWORD
        generateValue: true                           # sign-in list: node scripts/seed-credentials.mjs (docs/deployment.md section 9)
      # --- web
      - key: WEB_DIST_DIR
        value: apps/web/dist                          # API serves the SPA from here at /
      - key: PUBLIC_SITE_ORIGIN
        value: https://ari-public.onrender.com        # the ONLY cross-origin caller, only for POST /api/v1/public/forms/*. Change with the site host.
      - key: PUBLIC_ORIGIN
        sync: false                                   # optional. Empty = RENDER_EXTERNAL_URL. Set it when a custom domain is chosen.
      # --- optional until real data. Empty = e-mail is not sent (console mailer) and uploads stay in memory.
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CONTACT_INBOX
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  # 3. Cron: staleness check (REQ-067). Daily 05:10 UTC.
  - type: cron
    name: ari-cron-staleness
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "10 5 * * *"
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ari/api... build
    startCommand: node apps/api/dist/jobs/staleness.js
    autoDeployTrigger: "off"
    previews:
      generation: "off"
    envVars:
      - fromGroup: ari-common
      - fromGroup: ari-db-bg                          # logs in as app_readonly_bg
      - key: DB_HOST
        fromDatabase:
          name: ari-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ari-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ari-db
          property: database

  # 4. Cron: audit hash-chain verify. Hourly (C-16).
  - type: cron
    name: ari-cron-audit-verify
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "35 * * * *"
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ari/api... build
    startCommand: node apps/api/dist/jobs/audit-verify.js
    autoDeployTrigger: "off"
    previews:
      generation: "off"
    envVars:
      - fromGroup: ari-common
      - key: HEARTBEAT_URL_AUDIT_VERIFY
        sync: false
      - fromGroup: ari-db-bg                          # logs in as app_readonly_bg
      - key: DB_HOST
        fromDatabase:
          name: ari-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ari-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ari-db
          property: database

  # 5. Cron: retention purge. Nightly 02:40 UTC (C-07, C-16).
  - type: cron
    name: ari-cron-purge
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "40 2 * * *"
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ari/api... build
    startCommand: node apps/api/dist/jobs/purge.js
    autoDeployTrigger: "off"
    previews:
      generation: "off"
    envVars:
      - fromGroup: ari-common
      - fromGroup: ari-db-bg                          # logs in as app_readonly_bg
      - key: DB_HOST
        fromDatabase:
          name: ari-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ari-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ari-db
          property: database

  # 6. Cron: full logical export in open formats (REQ-070 round trip, extra copy). Daily 02:20 UTC.
  #    NOT YET ENFORCED: the job writes plain NDJSON to the object store; BACKUP_AGE_PUBLIC_KEY is not read by the code yet (docs/KNOWN-ISSUES.md).
  - type: cron
    name: ari-cron-export
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "20 2 * * *"
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ari/api... build
    startCommand: node apps/api/dist/jobs/export.js
    autoDeployTrigger: "off"
    previews:
      generation: "off"
    envVars:
      - fromGroup: ari-common
      - key: DATABASE_URL_BREAKGLASS
        sync: false                                   # app_break_glass is NOLOGIN. Ops enable it for an approved window (two approvers). Until then this job fails by design.
      - key: BACKUP_AGE_PUBLIC_KEY
        sync: false
      - fromGroup: ari-secrets-generated
      - fromGroup: ari-db-runtime
      - key: DB_HOST
        fromDatabase:
          name: ari-db
          property: host
      - key: DB_NAME
        fromDatabase:
          name: ari-db
          property: database
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: HEARTBEAT_URL_EXPORT
        sync: false

  # 7. Cron: privacy snapshot refresh. Hourly (QA-002). Search counts change only when this (or a coordinator import) publishes a new epoch.
  - type: cron
    name: ari-cron-snapshot
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "5 * * * *"
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ari/api... build
    startCommand: node apps/api/dist/jobs/snapshot.js
    autoDeployTrigger: "off"
    previews:
      generation: "off"
    envVars:
      - fromGroup: ari-common
      - fromGroup: ari-db-bg                          # logs in as app_readonly_bg
      - key: DB_HOST
        fromDatabase:
          name: ari-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ari-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ari-db
          property: database
