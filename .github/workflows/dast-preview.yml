# DAST on the PR preview. Synthetic data only. Needs the Render GitHub integration to emit deployment_status
# (UNVERIFIED). If it does not, run this manually with workflow_dispatch and a preview URL.
name: dast-preview
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target:
        description: Preview URL (https://*.onrender.com)
        required: true
permissions:
  contents: read
  issues: write
jobs:
  zap-baseline:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment != 'production-protected')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve preview URL
        id: url
        env:
          T1: ${{ github.event.deployment_status.environment_url }}
          T2: ${{ inputs.target }}
        run: |
          t="${T2:-$T1}"
          case "$t" in
            https://*.onrender.com|https://*.onrender.com/*) echo "target=$t" >> "$GITHUB_OUTPUT" ;;
            *) echo "Refusing to scan a non-preview host"; exit 1 ;;
          esac
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ steps.url.outputs.target }}
          rules_file_name: infra/ci/zap-rules.tsv
          fail_action: true
