# ARI-PST CI. The ONLY required status check is "ci-gate". Job ids are the A8 check names (C-15).
# Third-party actions are pinned by tag. SHA pinning TODO list: .github/SHA-PINNING-TODO.md
name: ci
on:
  pull_request:
  push:
    branches: [main, staging]
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# No top-level "paths" filter: a skipped required check would hang Render "checksPass".
jobs:
  lint-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run lint
      - run: pnpm run typecheck

  spectral:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run lint:openapi        # Spectral on packages/contracts/openapi.yaml, fail on warn

  arch-deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run arch                # dependency-cruiser: domain imports no platform library
      - run: pnpm run test:portability

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run test:unit
      - run: pnpm run test:synthetic-guard
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage/, retention-days: 14, if-no-files-found: ignore }

  property:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run test:property       # fast-check, including the privacy attack simulation

  integration-pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci-only-not-secret, POSTGRES_DB: ari_ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-only-not-secret@localhost:5432/ari_ci
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      # Old schema from main, seed, then PR migrations on top (expand/contract safety).
      - run: git checkout origin/main -- db/migrations || true
      - run: pnpm run db:migrate && pnpm run db:seed-synthetic
      - run: git checkout "${{ github.sha }}" -- db/migrations && pnpm run db:migrate
      - run: pnpm run lint:migrations
      - run: pnpm run test:rls            # runs as real non-superuser roles (C-06)
      - run: pnpm run test:integration

  contract-schemathesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci-only-not-secret, POSTGRES_DB: ari_ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-only-not-secret@localhost:5432/ari_ci
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - run: pnpm run test:contract       # API vs OpenAPI, plus oasdiff breaking-change check vs main

  sast-codeql:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/codeql.yml

  sast-semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: { image: "semgrep/semgrep:1.97.0" }
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/typescript --config p/nodejs --config infra/ci/semgrep.yml --error --metrics=off

  sca:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm dlx license-checker-rseidelsohn@4 --production --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;CC0-1.0;BlueOak-1.0.0;Python-2.0;MPL-2.0"
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with: { fail-on-severity: high, deny-licenses: "GPL-3.0-only, AGPL-3.0-only" }

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  container-scan:
    name: container-scan (config + Blueprint policy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: pip install pyyaml==6.0.2
      - run: python3 scripts/verify-render-yaml.py
      - run: python3 scripts/gen-staging.py --check
      - name: conftest policy on Blueprints
        run: docker run --rm -v "$PWD:/project" openpolicyagent/conftest:v0.56.0 test render.yaml infra/render.staging.yaml -p infra/policy
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: config, scan-ref: ".", exit-code: "1", severity: "HIGH,CRITICAL" }
      # No Dockerfile exists in Phase 1 (Render native runtimes). Add hadolint here if one is introduced.

  cms-guard:
    name: cms-guard (RT-10)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Content-editor branches may only change apps/public-site/src/content/**
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'cms/')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=$(git diff --name-only "$BASE" "$HEAD" | grep -v '^apps/public-site/src/content/' || true)
          if [ -n "$bad" ]; then echo "cms/* branch changed files outside content:"; echo "$bad"; exit 1; fi
      - name: Workflows must not use pull_request_target
        run: "! grep -rn 'pull_request_target' .github/workflows/ | grep -v 'semgrep'"

  build:
    needs: [lint-types, unit, arch-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run build
      - run: tar -czf build.tgz apps/public-site/dist apps/web/dist apps/api/dist
      - run: pnpm dlx @cyclonedx/cyclonedx-npm@1 --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            build.tgz
            sbom.cdx.json
          retention-days: 30
      - name: Provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with: { subject-path: build.tgz }

  canary-smoke:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci-only-not-secret, POSTGRES_DB: ari_ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-only-not-secret@localhost:5432/ari_ci
      DATA_CLASSIFICATION: synthetic
      SEED_SYNTHETIC: "true"
      NODE_ENV: production
      SESSION_SECRET: ci-only-not-secret-session
      AUDIT_HMAC_KEY: ci-only-not-secret-audit
      CSRF_SECRET: ci-only-not-secret-csrf
      WEB_DIST_DIR: apps/web/dist
      PORT: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @ari/api... build && pnpm --filter @ari/web build
      - run: node db/migrate.mjs
      - name: Start API and run smoke
        run: |
          node apps/api/dist/server.js > api.log 2>&1 &
          echo $! > api.pid
          BASE_URL=http://localhost:10000 bash scripts/smoke.sh --wait 60
      - name: API log on failure
        if: failure()
        run: tail -n 100 api.log || true

  e2e-smoke-he-en:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci-only-not-secret, POSTGRES_DB: ari_ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-only-not-secret@localhost:5432/ari_ci
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm run test:e2e:smoke      # he + en. Starts the stack itself (Playwright webServer).
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/, retention-days: 7, if-no-files-found: ignore }

  axe:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:a11y           # axe, he + en, zero serious/critical

  trace-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run test:trace          # REQ to test traceability

  ci-gate:
    name: ci-gate
    if: always()
    needs: [lint-types, spectral, arch-deps, unit, property, integration-pg, contract-schemathesis, sast-codeql, sast-semgrep, sca, secrets, container-scan, cms-guard, build, canary-smoke, e2e-smoke-he-en, axe, trace-check]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any needed job did not succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c "import json,sys; n=json.load(sys.stdin); bad=[k for k,v in n.items() if v['result']!='success']; print('not ok:',bad); sys.exit(1 if bad else 0)"
