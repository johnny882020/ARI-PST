# Synthetic data profiles. Counts are exact where stated. Fake data only.
version: 1
fake_markers:
  center_names: ["Synthetic Center A", "Synthetic Center B", "Synthetic Center C", "Synthetic Center D", "Synthetic Center E"]
  email_domain: example.invalid
  approval_ref_pattern: "SYNTH-ETH-{center}-{nnn}"
  text_prefix: "SYNTHETIC:"
profiles:
  tiny:
    seed: 1
    centers: [A, B]
    cells:      # exact counts, same shape as sql/tests/test_rls_k.sql
      - { center: A, diagnosis: dmg_h3k27, n: 12 }
      - { center: A, diagnosis: pilocytic_astrocytoma, n: 3 }
      - { center: B, diagnosis: mb_wnt, n: 2 }
      - { center: B, diagnosis: mb_shh, n: 2 }
      - { center: B, diagnosis: ependymoma_posterior_fossa, n: 3 }
    expected_k5_diagnosis_facet:
      - { bucket: dmg_h3k27, level: type, n: 12 }
      - { bucket: other, level: other, n: 10 }
  kedge:
    seed: 7
    centers: [A, B, C]
    cells:
      - { center: A, diagnosis: mb_wnt, n: 6 }                   # exactly k+1: shown
      - { center: A, diagnosis: mb_shh, n: 5 }                   # exactly k: shown
      - { center: A, diagnosis: mb_non_wnt_non_shh, n: 4 }       # k-1: rolls to family
      - { center: B, diagnosis: ependymoma_posterior_fossa, n: 3 }
      - { center: B, diagnosis: ependymoma_supratentorial, n: 1 }  # family sum 4 <k: rolls to group
      - { center: C, diagnosis: pilocytic_astrocytoma, n: 4 }
      - { center: C, diagnosis: dmg_h3k27, n: 1 }
    notes: "Group sums and complementary-suppression outcome are listed in expected.json (generated by the reference SQL, then reviewed)."
  preview: { seed: 11, centers: [A, B, C], samples: 600, weights_ref: weights.default }
  load:    { seed: 13, centers: [A, B, C, D, E], samples: 50000, weights_ref: weights.default }
  stale:
    seed: 17
    centers: [A, B, C]
    samples: 300
    verified_days_ago: [0, 150, 175, 181, 400]
weights:
  default:
    age_band: { "0_lt1": 0.08, "1_lt3": 0.17, "3_lt6": 0.22, "6_lt10": 0.23, "10_lt15": 0.2, "15_lt18": 0.1 }
    sex: { female: 0.47, male: 0.5, other_or_unknown: 0.03 }
    timepoint: { diagnosis: 0.7, during_treatment: 0.2, relapse: 0.1 }
    sample_type: { ffpe: 0.55, frozen: 0.2, csf: 0.08, plasma_or_liquid_biopsy: 0.1, isolated_dna_rna: 0.07 }
    availability: { available: 0.75, limited: 0.15, depleted: 0.1 }
    attached_data_probability: { wes: 0.2, wgs: 0.05, rna_seq: 0.15, mri: 0.5, digital_pathology: 0.0, redcap_clinical: 0.6 }
guards:
  refuse_if_flag_set: GATE_PROD_DATA_CLOSED     # generator must not run once real data is allowed
  preview_and_staging_reject_real_rows: true
