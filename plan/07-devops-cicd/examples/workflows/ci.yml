# ARI-PST Portal - main CI. Required status check: "ci-gate".
# SHA PINNING POLICY: production copies of this file pin every third-party action to a full commit SHA.
# This plan file uses version tags because SHAs could not be verified offline (UNVERIFIED). Dependabot/Renovate updates SHAs.
name: ci
on:
  pull_request:
  push:
    branches: [main, staging]
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"
jobs:
  setup-lint-type:
    name: lint + typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: Commit message check (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit -- --coverage
      - run: pnpm run test:synthetic-guard   # no realistic personal data in fixtures
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage/, retention-days: 14 }

  architecture:
    name: architecture + portability tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Fails if packages/domain imports pg, auth, storage, email or search libraries (contract pack section 1).
      - run: pnpm exec depcruise --config infra/ci/dependency-cruiser.cjs packages apps
      - run: pnpm run test:portability   # contract tests against ports, run on the in-memory adapters

  openapi:
    name: OpenAPI lint + contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci-only-not-secret, POSTGRES_DB: ari_ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-only-not-secret@localhost:5432/ari_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec spectral lint packages/contracts/openapi.yaml --fail-severity=warn
      - name: Breaking-change check against main
        run: pnpm exec oasdiff breaking "git:origin/main:packages/contracts/openapi.yaml" packages/contracts/openapi.yaml --fail-on ERR
      - run: pnpm run db:migrate
      - run: pnpm run test:contract    # API vs OpenAPI (schemathesis or generated tests)

  migration-dry-run:
    name: migration dry-run + expand/contract lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci-only-not-secret, POSTGRES_DB: ari_ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-only-not-secret@localhost:5432/ari_ci
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # 1. Apply the migrations that exist on main (the "old" schema) and seed synthetic data.
      - run: git checkout origin/main -- db/migrations && pnpm run db:migrate && pnpm run db:seed-synthetic
      # 2. Apply the PR migrations on top (forward-only).
      - run: git checkout "${{ github.sha }}" -- db/migrations && pnpm run db:migrate
      # 3. Old API build must still pass smoke tests on the new schema (expand/contract safety).
      - run: pnpm run test:old-api-on-new-schema
      - run: pnpm run lint:migrations   # blocks DROP/RENAME/NOT NULL without default in the same release as the code change
      - run: pnpm run test:rls          # RLS policies still deny by default

  build:
    needs: [setup-lint-type, unit, architecture, openapi, migration-dry-run]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write       # provenance (OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Package build output
        run: tar -czf build.tgz apps/public-site/dist apps/web/dist apps/api/dist
      - name: SBOM (CycloneDX)
        run: pnpm dlx @cyclonedx/cyclonedx-npm --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: build, path: "build.tgz\nsbom.cdx.json", retention-days: 30 }
      - name: Build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with: { subject-path: build.tgz }
      - name: SBOM attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@v2
        with: { subject-path: build.tgz, sbom-path: sbom.cdx.json }

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  dependency-license:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm exec license-checker-rseidelsohn --production --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;CC0-1.0;BlueOak-1.0.0;Python-2.0"
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with: { fail-on-severity: high, deny-licenses: "GPL-3.0-only, AGPL-3.0-only" }

  sast-semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: { image: "semgrep/semgrep:1.97.0" }
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/typescript --config p/nodejs --config infra/ci/semgrep.yml --error --metrics=off

  iac-scan:
    name: IaC + Dockerfile + policy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - name: Validate Blueprint
        run: |
          curl -fsSL https://raw.githubusercontent.com/render-oss/cli/main/bin/install.sh | sh
          render blueprints validate infra/render.yaml
          render blueprints validate infra/render.staging.yaml
      - name: Staging Blueprint drift check
        run: python3 scripts/gen-staging.py --check
      - name: Policy-as-code on Blueprint (conftest)
        uses: instrumenta/conftest-action@master   # UNVERIFIED action name; may be replaced by running the conftest binary
        with: { files: "infra/render.yaml infra/render.staging.yaml", policy: infra/policy }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: config, scan-ref: ".", exit-code: "1", severity: "HIGH,CRITICAL" }
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: infra/docker/backup-export.Dockerfile }

  a11y-lighthouse:
    name: a11y (axe) + Lighthouse gates
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @ari/public-site build
      - run: pnpm run test:a11y          # Playwright + axe, he and en, zero serious/critical violations
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: infra/ci/lighthouserc.json   # asserts: a11y >= 0.95, perf >= 0.85, SEO >= 0.9, best-practices >= 0.9
          uploadArtifacts: true

  ci-gate:
    name: ci-gate
    if: always()
    needs: [setup-lint-type, unit, architecture, openapi, migration-dry-run, build, secret-scan, dependency-license, sast-semgrep, iac-scan, a11y-lighthouse]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any needed job did not succeed
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c "import json,sys; n=json.load(sys.stdin); bad=[k for k,v in n.items() if v['result']!='success']; print('not ok:',bad); sys.exit(1 if bad else 0)"
