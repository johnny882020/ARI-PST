# ARI-PST Portal - production Blueprint (tracks branch: main).
# Staging uses render.staging.yaml (tracks branch: staging). Synthetic data only until GATE-PROD-DATA closes.
# Validate: render blueprints validate examples/render.yaml   (CLI v2.7.0+)
# Facts marked UNVERIFIED in 08-research-log.md. Names, plans and regions are variables of the plan, not final.
previews:
  generation: automatic        # PR previews on. API seeds synthetic data when IS_PULL_REQUEST=true (UNVERIFIED var name).
  expireAfterDays: 3

envVarGroups:
  - name: ari-common
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_FORMAT
        value: json
      - key: DATA_CLASSIFICATION
        value: synthetic            # flips to "index" only through ADR + GATE-PROD-DATA
  - name: ari-api-secrets
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: AUDIT_HMAC_KEY
        generateValue: true
      - key: SMTP_URL
        sync: false                 # set once in Dashboard. Never in Git.
      - key: OBJECTSTORE_ACCESS_KEY
        sync: false
      - key: OBJECTSTORE_SECRET_KEY
        sync: false

databases:
  - name: ari-db
    databaseName: ari_portal
    user: ari_app
    region: frankfurt               # GATE-REGION default. Immutable after create.
    plan: basic-1gb                 # UNVERIFIED slug. Choose a plan with PITR + enough RPO. See 02 doc.
    previewPlan: basic-256mb
    diskSizeGB: 15
    previewDiskSizeGB: 1
    postgresMajorVersion: "16"
    ipAllowList: []                 # Empty = private network only. No public access.

services:
  # 1. Public static site. Auto-deploys after CI passes.
  - type: web
    name: ari-public-site
    runtime: static
    region: frankfurt
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ari/public-site build
    staticPublishPath: apps/public-site/dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/public-site/**
        - packages/design-system/**
        - packages/i18n/**
        - pnpm-lock.yaml
      ignoredPaths:
        - "**/*.md"
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'"
    routes:
      - type: rewrite
        source: /he/*
        destination: /he/index.html
      - type: rewrite
        source: /en/*
        destination: /en/index.html

  # 2. Protected SPA (React + Vite). Manual gate: deploy from GitHub Actions after approval.
  - type: web
    name: ari-app
    runtime: static
    region: frankfurt
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ari/web build
    staticPublishPath: apps/web/dist
    autoDeployTrigger: "off"        # Protected area. Deploy hook is called only after environment approval.
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. API web service (Fastify). Protected area. Manual gate.
  - type: web
    name: ari-api
    runtime: node
    region: frankfurt
    plan: starter                   # UNVERIFIED. Zero-downtime needs a paid instance; use >=2 instances for HA.
    previewPlan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ari/api build
    preDeployCommand: pnpm --filter @ari/api migrate:deploy   # forward-only SQL, expand/contract. Fails -> deploy aborts.
    startCommand: pnpm --filter @ari/api start
    healthCheckPath: /healthz       # Must check DB reachability + migration level. Returns 200 only when ready.
    maxShutdownDelaySeconds: 60     # Drain in-flight requests on SIGTERM.
    autoDeployTrigger: "off"        # Protected area. Gate in GitHub Environment "production-protected".
    numInstances: 2
    envVars:
      - fromGroup: ari-common
      - fromGroup: ari-api-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: ari-db
          property: connectionString
      - key: PUBLIC_ORIGIN
        value: https://portal.example.org      # placeholder domain
      - key: REGION_PIN
        value: frankfurt
      - key: REPORT_WORKER_URL
        fromService:
          type: pserv
          name: ari-internal
          property: hostport

  # 4. Private service: internal-only helper (audit-chain verification API, export builder).
  #    Reachable only on the Render private network. Not routed from the internet.
  - type: pserv
    name: ari-internal
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ari/api build
    startCommand: pnpm --filter @ari/api start:internal
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: ari-common
      - key: DATABASE_URL
        fromDatabase:
          name: ari-db
          property: connectionString

  # 5. Cron: staleness check (REQ-067). Daily 05:10 UTC.
  - type: cron
    name: ari-cron-staleness
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "10 5 * * *"
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ari/api build
    startCommand: pnpm --filter @ari/api job:staleness-check
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: ari-common
      - key: DATABASE_URL
        fromDatabase:
          name: ari-db
          property: connectionString

  # 6. Cron: logical backup export to object storage (extra to Render managed backups). Daily 02:20 UTC.
  - type: cron
    name: ari-cron-backup-export
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: "20 2 * * *"
    dockerfilePath: ./infra/docker/backup-export.Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: ari-common
      - fromGroup: ari-api-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: ari-db
          property: connectionString
      - key: BACKUP_ENCRYPTION_KEY
        sync: false                 # Encrypted export. Key lives in KMS/Dashboard, never in Git.

  # 7. Cron: audit hash-chain verification. Hourly.
  - type: cron
    name: ari-cron-audit-verify
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "35 * * * *"
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ari/api build
    startCommand: pnpm --filter @ari/api job:audit-chain-verify
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: ari-common
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ari-db
          property: connectionString
